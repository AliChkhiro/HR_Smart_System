spring:
  application:
    name: apprh-backend
  # Profil de développement par défaut. En production : SPRING_PROFILES_ACTIVE=prod.
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/apprh}
    username: ${DB_USERNAME:apprh}
    # Aucun mot de passe par défaut ici : fourni par le profil (dev) ou l'environnement (prod).
    password: ${DB_PASSWORD:}
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  jwt:
    # Aucun secret de repli dans la configuration de base.
    # Valeur obligatoire (JWT_SECRET) — voir application-dev.yml / application-prod.yml.
    secret: ${JWT_SECRET:}
    access-token-ttl: ${JWT_ACCESS_TTL:15m}
    refresh-token-ttl: ${JWT_REFRESH_TTL:7d}
  seed:
    password: ${SEED_PASSWORD:Apprh@2026!}
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:no-reply@apprh.local}
  ia-service:
    url: ${IA_SERVICE_URL:http://localhost:8000}
  chatbot:
    base-url: ${CHATBOT_IA_SERVICE_URL:http://localhost:8000}
    model: ${CHATBOT_OLLAMA_MODEL:llama3.2:3b}
    timeout-ms: ${CHATBOT_TIMEOUT_MS:30000}
    rate-limit-max: ${CHATBOT_RATE_LIMIT_MAX:30}
    rate-limit-window-seconds: ${CHATBOT_RATE_LIMIT_WINDOW_SECONDS:60}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    com.apprh.backend: INFO
