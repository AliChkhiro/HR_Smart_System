<mat-card>
  <mat-card-header>
    <mat-card-title>Utilisateurs</mat-card-title>
    <mat-card-subtitle>Gestion des comptes et des rôles (réservé Administrateur)</mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    <div class="toolbar">
      <mat-form-field class="search-field">
        <mat-label>Rechercher</mat-label>
        <input matInput [(ngModel)]="search" (keyup.enter)="load()" placeholder="Nom, prénom ou email" />
      </mat-form-field>
      <button mat-raised-button color="primary" (click)="load()">
        <mat-icon>search</mat-icon>
        Rechercher
      </button>
      <span class="spacer"></span>
      <button mat-raised-button color="accent" (click)="openCreate()">
        <mat-icon>person_add</mat-icon>
        Nouvel utilisateur
      </button>
    </div>

    @if (loading()) {
      <div class="spinner"><mat-spinner diameter="40" /></div>
    } @else {
      <table mat-table [dataSource]="users()" class="full-width">
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Nom</th>
          <td mat-cell *matCellDef="let user">{{ user.firstName }} {{ user.lastName }}</td>
        </ng-container>

        <ng-container matColumnDef="email">
          <th mat-header-cell *matHeaderCellDef>Email</th>
          <td mat-cell *matCellDef="let user">{{ user.email }}</td>
        </ng-container>

        <ng-container matColumnDef="role">
          <th mat-header-cell *matHeaderCellDef>Rôle</th>
          <td mat-cell *matCellDef="let user">
            <mat-chip>{{ roleLabels[user.role] }}</mat-chip>
          </td>
        </ng-container>

        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef>Statut</th>
          <td mat-cell *matCellDef="let user">
            <mat-chip [class.active-chip]="user.status === 'ACTIVE'" [class.disabled-chip]="user.status === 'DISABLED'">
              {{ user.status === 'ACTIVE' ? 'Actif' : 'Désactivé' }}
            </mat-chip>
          </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Actions</th>
          <td mat-cell *matCellDef="let user">
            <button mat-icon-button (click)="openEdit(user)" matTooltip="Modifier">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button (click)="toggleStatus(user)" [matTooltip]="user.status === 'ACTIVE' ? 'Désactiver' : 'Réactiver'">
              <mat-icon>{{ user.status === 'ACTIVE' ? 'block' : 'check_circle' }}</mat-icon>
            </button>
            <button mat-icon-button (click)="delete(user)" matTooltip="Supprimer">
              <mat-icon color="warn">delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>
    }
  </mat-card-content>
</mat-card>
