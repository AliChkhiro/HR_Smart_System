<h2 mat-dialog-title>{{ isEdit ? 'Modifier la compétence' : 'Nouvelle compétence' }}</h2>
<mat-dialog-content>
  <form [formGroup]="form">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Nom</mat-label>
      <input matInput formControlName="name" placeholder="Ex : Java, Docker…" />
      @if (form.controls.name.hasError('required')) {
        <mat-error>Le nom est obligatoire</mat-error>
      }
    </mat-form-field>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Catégorie</mat-label>
      <mat-select formControlName="category">
        @for (category of categories; track category) {
          <mat-option [value]="category">{{ category }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Annuler</button>
  <button mat-flat-button color="primary" (click)="submit()" [disabled]="form.invalid || submitting">
    @if (submitting) {
      <mat-spinner diameter="18" />
    } @else {
      Enregistrer
    }
  </button>
</mat-dialog-actions>
