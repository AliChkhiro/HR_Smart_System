<h2 mat-dialog-title>{{ isEdit ? 'Modifier le département' : 'Nouveau département' }}</h2>
<mat-dialog-content>
  <form [formGroup]="form">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Nom</mat-label>
      <input matInput formControlName="name" placeholder="Ex : Développement" />
      @if (form.controls.name.hasError('required')) {
        <mat-error>Le nom est obligatoire</mat-error>
      }
    </mat-form-field>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Description</mat-label>
      <textarea matInput formControlName="description" rows="3"></textarea>
    </mat-form-field>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Responsable</mat-label>
      <mat-select formControlName="managerId">
        <mat-option [value]="null">Aucun</mat-option>
        @for (manager of managers(); track manager.id) {
          <mat-option [value]="manager.id">
            {{ manager.firstName }} {{ manager.lastName }} ({{ manager.email }})
          </mat-option>
        }
      </mat-select>
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Annuler</button>
  <button mat-flat-button color="primary" (click)="submit()" [disabled]="form.invalid || submitting">
    @if (submitting) {
      <mat-spinner diameter="18" />
    } @else {
      Enregistrer
    }
  </button>
</mat-dialog-actions>
