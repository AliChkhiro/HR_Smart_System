services:
  db:
    image: postgres:17-alpine
    container_name: apprh-db
    environment:
      POSTGRES_DB: ${DB_NAME:-apprh}
      POSTGRES_USER: ${DB_USERNAME:-apprh}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD est requis - copiez .env.example vers .env et renseignez-le}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: apprh-backend
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_URL: "jdbc:postgresql://db:5432/${DB_NAME:-apprh}"
      DB_USERNAME: ${DB_USERNAME:-apprh}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD est requis - copiez .env.example vers .env et renseignez-le}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET est requis - copiez .env.example vers .env et renseignez-le}
      IA_SERVICE_URL: http://ia-service:8000
      CHATBOT_IA_SERVICE_URL: http://ia-service:8000
      CHATBOT_OLLAMA_MODEL: ${CHATBOT_OLLAMA_MODEL:-llama3.2:3b}
      CHATBOT_TIMEOUT_MS: ${CHATBOT_TIMEOUT_MS:-90000}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    depends_on:
      db:
        condition: service_healthy
      ia-service:
        condition: service_healthy

  ia-service:
    build: ./ia-service
    container_name: apprh-ia-service
    environment:
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: llama3.2:3b
      CHATBOT_TIMEOUT_SECONDS: 80
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      ollama:
        condition: service_healthy

  ollama:
    image: ollama/ollama:0.6.7
    container_name: apprh-ollama
    environment:
      OLLAMA_KEEP_ALIVE: 24h
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama --version >/dev/null 2>&1 || curl -fsS http://localhost:11434/api/version >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build: ./frontend
    container_name: apprh-frontend
    ports:
      - "4200:80"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/ >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 6
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  ollama: