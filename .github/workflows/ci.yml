name: CI

on:
  push:
    branches: [main]
  pull_request:

# Permissions minimales : lecture seule du dépôt. Aucun secret, aucun déploiement.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint, build, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installation de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installation des dépendances
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Tests (vitest)
        run: npm test -- --no-watch

  backend:
    name: Backend (Maven, tests Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installation de Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Le wrapper Maven n'a pas le bit d'exécution dans le dépôt : exécution via sh.
      # `verify` compile, exécute les tests (Testcontainers + Docker préinstallé sur
      # ubuntu-latest) et construit le jar.
      - name: Build et tests
        run: sh ./mvnw -B verify --no-transfer-progress
